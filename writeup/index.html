<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfa">
  <meta name="description" content="An interactive visual canvas of Pi, from context ingestion to action.">
  <title>Pi · Kuan Yi Wang</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#contents">Skip to contents</a>
  <main class="workspace">
    <section class="canvas-shell" aria-label="Interactive Pi architecture canvas">
      <button class="start-button" id="start" type="button">Start walkthrough <span aria-hidden="true">→</span></button>
      <div class="viewport" id="viewport" tabindex="0" aria-label="Diagram canvas. Drag to pan; pinch or use plus and minus to zoom. Left and right arrows or Space move through the walkthrough. Escape returns to the whole canvas.">
        <div class="world" id="world">
          <div id="artwork" role="img" aria-label="Pi architecture: spatial and semantic context ingestion, VLM backbone, flow-matching model, and expanded transformer layer."></div>
          <div class="lifted-region" id="lifted" aria-hidden="true" hidden></div>
          <div id="hotspots" role="group" aria-label="Inspect diagram details"></div>
          <div class="detail-outline" id="detail-outline" aria-hidden="true" hidden></div>
        </div>
      </div>
      <div class="loading" id="loading" role="status">Opening the drawing…</div>
      <div class="asset-error" id="asset-error" hidden><p>The drawing couldn’t load.</p><button id="retry" type="button">Try again</button></div>
    </section>
    <aside class="notes" id="contents" tabindex="-1" aria-label="Canvas contents">
      <nav class="macro-tabs" id="macro-tabs" aria-label="Major sections"></nav>
      <div class="notes-scroll" id="notes-scroll">
        <nav id="toc" aria-label="Section contents"></nav>
        <div id="annotation" hidden></div>
      </div>
    </aside>
  </main>
  <div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
  <noscript><div class="no-script">This canvas needs JavaScript. <a href="./assets/full-backbone.svg">Open the drawing</a>.</div></noscript>
</body>
</html>
