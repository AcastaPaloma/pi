<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfa">
  <meta name="description" content="π0.7 at runtime: two SO-101 arms, three models, and one inference timeline, block by block. Then the Training tab explains how each model is built.">
  <title>π0.7 inference · Kuan Yi Wang</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <script>
    // Links shared before the Inference tab existed point at training sections; send them there.
    if (location.hash && !location.hash.startsWith('#inf-')) location.replace('training.html' + location.hash);
  </script>
  <link rel="modulepreload" href="./vendor/three.module.min.js">
  <link rel="stylesheet" href="./style.css?v=20261015-i1">
  <link rel="stylesheet" href="./inference.css?v=20261015-i1">

<body class="inference-page">
  <a class="skip-link" href="#reader">Skip to the walkthrough text</a>
  <main class="workspace">
    <section class="visual-column" aria-label="Robot replay and inference timeline">
      <div class="stage" id="stage" role="img" aria-label="3D replay of two SO-101 arms washing a plate at a small sink, with an overhead camera on a gantry and a camera on each wrist. Each block of the timeline below is replayed in slow motion.">
        <div class="stage-loading" id="stage-loading">Building the robot…</div>
      </div>
      <div class="timeline canvas-shell" aria-label="Inference timeline drawing">
        <button class="start-button" id="start" type="button">Whole timeline <span aria-hidden="true">↔</span></button>
        <div class="viewport" id="viewport">
          <div class="world" id="world">
            <div id="artwork" role="img" aria-label="Inference timeline with five lanes: motors, sensors, low-level VLM, high-level VLM, and the BAGEL world model, from startup to 2100 milliseconds."></div>
            <div class="lifted-region" id="lifted" aria-hidden="true" hidden></div>
            <div id="hotspots" role="group" aria-label="Timeline blocks"></div>
          </div>
        </div>
        <div class="loading" id="loading" role="status">Opening the timeline…</div>
      </div>
    </section>
    <aside class="notes" aria-label="Inference walkthrough">
      <div class="reading-nav">
        <nav class="page-tabs" aria-label="Write-up sections"><a href="./" aria-current="page">Inference</a><a href="training.html">Training</a></nav>
        <span class="step-counter" id="counter"></span>
      </div>
      <div class="reader" id="reader" tabindex="0" aria-label="Inference walkthrough text">
        <article id="article"></article>
      </div>
      <div class="player" role="group" aria-label="Walkthrough controls">
        <div class="player-progress" aria-hidden="true"><i id="progress"></i></div>
        <button id="prev" type="button" aria-label="Previous block"><span aria-hidden="true">←</span></button>
        <button id="play" type="button" aria-pressed="true">Pause</button>
        <button id="next" type="button" aria-label="Next block"><span aria-hidden="true">→</span></button>
        <span class="loop-label" id="cycle"></span>
      </div>
    </aside>
  </main>
  <div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
  <noscript><div class="no-script">This walkthrough needs JavaScript. <a href="./assets/inference.svg">Open the timeline drawing</a> or <a href="training.html">read the training write-up</a>.</div></noscript>
</body>
</html>
