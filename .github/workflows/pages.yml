name: Deploy Pi canvas

on:
  push:
    branches: [main]
    paths:
      - 'writeup/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify canvas
        run: |
          npm --prefix writeup test
          node --check writeup/app.js
          node --check writeup/inference.js
          node --check writeup/robot-stage.js
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/assets/so101 _site/vendor
          cp writeup/index.html writeup/training.html writeup/style.css writeup/inference.css writeup/app.js writeup/content.js writeup/article.js writeup/inference.js writeup/inference-content.js writeup/robot-stage.js writeup/camera.mjs writeup/reading.mjs writeup/rich-text.mjs writeup/text.json _site/
          cp writeup/assets/*.svg _site/assets/
          cp writeup/assets/so101/so101.json writeup/assets/so101/so101.bin writeup/assets/so101/LICENSE _site/assets/so101/
          cp writeup/vendor/three.module.min.js writeup/vendor/LICENSE-three.txt _site/vendor/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
