name: Redirect Pages to kuant.space

on:
  push:
    branches: [main]
    paths:
      - 'writeup/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify canvas
        run: |
          npm --prefix writeup test
          node --check writeup/app.js
          node --check writeup/inference.js
          node --check writeup/robot-stage.js
          node --check writeup/results.js
          node --check writeup/results-tree.js
      - uses: actions/configure-pages@v5
      # The write-up now lives at https://www.kuant.space/pi/ (the portfolio copies writeup/ at build time).
      # Pages keeps serving one stub per page so old links, hash included, land on the same page there.
      - name: Build redirect stubs
        run: |
          mkdir -p _site
          stub() {
            cat > "_site/$1" <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Moved to kuant.space</title>
            <link rel="canonical" href="$2">
            <script>location.replace('https://www.kuant.space' + location.pathname + location.search + location.hash);</script>
            <noscript><meta http-equiv="refresh" content="0; url=$2"></noscript>
          </head>
          <body><p>This page moved to <a href="$2">$2</a>.</p></body>
          </html>
          HTML
          }
          for page in writeup/*.html; do
            name=$(basename "$page")
            if [ "$name" = index.html ]; then stub "$name" https://www.kuant.space/pi/; else stub "$name" "https://www.kuant.space/pi/$name"; fi
          done
          stub 404.html https://www.kuant.space/pi/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
